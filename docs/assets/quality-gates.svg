<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Quality gates and local run artifacts</title>
  <desc id="desc">The workflow keeps plan, prompts, manifest, QA and dispatch artifacts for every local run.</desc>
  <rect width="1400" height="360" rx="28" fill="#E8E1D2"/>
  <g font-family="'Avenir Next', 'Helvetica Neue', sans-serif" fill="#183A36">
    <text x="72" y="62" font-size="16" letter-spacing="3" fill="#943F2B">QUALITY GATES / LOCAL RUN RECORDS</text>
    <text x="72" y="104" font-size="31" font-weight="700">Approve before calling. Retry only failed tasks.</text>
    <text x="72" y="134" font-size="16" fill="#4D625D">Every run can be reviewed, handed off, and resumed.</text>
    <g transform="translate(72 190)"><rect width="214" height="96" rx="15" fill="#183A36"/><text x="22" y="35" font-size="14" fill="#E9A948">plan.json</text><text x="22" y="65" font-size="17" fill="#FFFDF8">Facts and scope</text></g>
    <g transform="translate(310 190)"><rect width="214" height="96" rx="15" fill="#FFFDF8" stroke="#183A36" stroke-opacity=".2"/><text x="22" y="35" font-size="14" fill="#943F2B">prompts.md</text><text x="22" y="65" font-size="17" fill="#183A36">Approved prompts</text></g>
    <g transform="translate(548 190)"><rect width="214" height="96" rx="15" fill="#FFFDF8" stroke="#183A36" stroke-opacity=".2"/><text x="22" y="35" font-size="14" fill="#943F2B">manifest.json</text><text x="22" y="65" font-size="17" fill="#183A36">Task and asset map</text></g>
    <g transform="translate(786 190)"><rect width="214" height="96" rx="15" fill="#BF5A3F"/><text x="22" y="35" font-size="14" fill="#FCE8D8">qa.json</text><text x="22" y="65" font-size="17" fill="#FFFDF8">Pass, fail, retry</text></g>
    <g transform="translate(1024 190)"><rect width="240" height="96" rx="15" fill="#E9A948"/><text x="22" y="35" font-size="14" fill="#183A36">dispatch.json</text><text x="22" y="65" font-size="17" fill="#183A36">Final call review</text></g>
  </g>
  <g fill="#183A36"><path d="M290 232l13 7-13 7v-14ZM528 232l13 7-13 7v-14ZM766 232l13 7-13 7v-14ZM1004 232l13 7-13 7v-14Z"/></g>
</svg>
