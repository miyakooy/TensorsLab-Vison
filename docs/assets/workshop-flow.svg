<svg width="1400" height="390" viewBox="0 0 1400 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Miaodashi Visual Workshop production flow</title>
  <desc id="desc">Assets move through fact locking, prompt planning, generation, quality review, and delivery.</desc>
  <rect width="1400" height="390" rx="28" fill="#F4F0E7"/>
  <path d="M80 196H1320" stroke="#183A36" stroke-opacity=".18" stroke-width="2" stroke-dasharray="8 10"/>
  <g font-family="'Avenir Next', 'Helvetica Neue', sans-serif" fill="#183A36">
    <text x="80" y="58" font-size="16" letter-spacing="3" fill="#943F2B">MIAODASHI WORKSHOP / CONFIRMED PRODUCTION</text>
    <text x="80" y="94" font-size="30" font-weight="700">From source assets to reviewed delivery</text>
    <text x="80" y="122" font-size="16" fill="#4D625D">Every stage leaves a reviewable plan, prompt, task record, and QA result.</text>
  </g>
  <g font-family="'Avenir Next', 'Helvetica Neue', sans-serif">
    <g transform="translate(80 155)"><rect width="190" height="115" rx="16" fill="#183A36"/><text x="22" y="31" font-size="12" letter-spacing="2" fill="#E9A948">01 / INTAKE</text><text x="22" y="66" font-size="22" fill="#FFFDF8">Register assets</text><text x="22" y="91" font-size="14" fill="#C8D4CE">Role · SKU · channel</text></g>
    <g transform="translate(320 155)"><rect width="190" height="115" rx="16" fill="#FFFDF8" stroke="#183A36" stroke-opacity=".2"/><text x="22" y="31" font-size="12" letter-spacing="2" fill="#943F2B">02 / LOCK</text><text x="22" y="66" font-size="22" fill="#183A36">Lock facts</text><text x="22" y="91" font-size="14" fill="#4D625D">Color · material · claims</text></g>
    <g transform="translate(560 155)"><rect width="190" height="115" rx="16" fill="#FFFDF8" stroke="#183A36" stroke-opacity=".2"/><text x="22" y="31" font-size="12" letter-spacing="2" fill="#943F2B">03 / PLAN</text><text x="22" y="66" font-size="22" fill="#183A36">Plan prompts</text><text x="22" y="91" font-size="14" fill="#4D625D">Ratio · shot · batch</text></g>
    <g transform="translate(800 155)"><rect width="190" height="115" rx="16" fill="#BF5A3F"/><text x="22" y="31" font-size="12" letter-spacing="2" fill="#FCE8D8">04 / RUN</text><text x="22" y="66" font-size="22" fill="#FFFDF8">Run tasks</text><text x="22" y="91" font-size="14" fill="#FCE8D8">Reuse tl-image / tl-video</text></g>
    <g transform="translate(1040 155)"><rect width="190" height="115" rx="16" fill="#E9A948"/><text x="22" y="31" font-size="12" letter-spacing="2" fill="#183A36">05 / QA</text><text x="22" y="66" font-size="22" fill="#183A36">Review delivery</text><text x="22" y="91" font-size="14" fill="#183A36">Pass · retry · archive</text></g>
  </g>
  <g fill="#183A36"><path d="M285 190l18 6-18 6v-12ZM525 190l18 6-18 6v-12ZM765 190l18 6-18 6v-12ZM1005 190l18 6-18 6v-12Z"/></g>
</svg>
