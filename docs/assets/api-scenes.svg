<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TensorsLab Vision API scene map</title>
  <desc id="desc">Image and video skills share a common scene map and return task records for quality review.</desc>
  <rect width="1400" height="430" rx="28" fill="#183A36"/>
  <circle cx="1160" cy="82" r="170" fill="#BF5A3F" fill-opacity=".36"/><circle cx="1260" cy="340" r="210" fill="#E9A948" fill-opacity=".16"/>
  <g font-family="Arial, 'Noto Sans SC', sans-serif">
    <text x="72" y="72" font-size="16" letter-spacing="3" fill="#E9A948">TENSORSLAB VISION / API SCENES</text>
    <text x="72" y="116" font-size="34" font-weight="700" fill="#FFFDF8">直接能力 + 可复用场景</text>
    <text x="72" y="150" font-size="16" fill="#C8D4CE">tl-image 与 tl-video 保持原有 API；Workshop 负责把业务需求变成确认后的调用计划。</text>
    <g transform="translate(72 208)"><rect width="360" height="150" rx="20" fill="#FFFDF8"/><text x="26" y="38" font-size="13" letter-spacing="2" fill="#943F2B">TL-IMAGE</text><text x="26" y="78" font-size="25" font-weight="700" fill="#183A36">图像生产</text><text x="26" y="110" font-size="15" fill="#4D625D">生图 · 改图 · 参考图 · 画布</text><text x="26" y="134" font-size="13" fill="#4D625D">Seedream / Z-Image / quick edit</text></g>
    <g transform="translate(470 208)"><rect width="360" height="150" rx="20" fill="#BF5A3F"/><text x="26" y="38" font-size="13" letter-spacing="2" fill="#FCE8D8">TL-VIDEO</text><text x="26" y="78" font-size="25" font-weight="700" fill="#FFFDF8">视频生产</text><text x="26" y="110" font-size="15" fill="#FCE8D8">文生视频 · 图生视频 · 任务查询</text><text x="26" y="134" font-size="13" fill="#FCE8D8">Seedance V2 / status polling</text></g>
    <g transform="translate(868 208)"><rect width="430" height="150" rx="20" fill="#E9A948"/><text x="26" y="38" font-size="13" letter-spacing="2" fill="#183A36">WORKSHOP</text><text x="26" y="78" font-size="25" font-weight="700" fill="#183A36">业务场景编排</text><text x="26" y="110" font-size="15" fill="#183A36">电商主图 · 详情页 · 广告短片</text><text x="26" y="134" font-size="13" fill="#183A36">计划、审批、质检、重试、交付</text></g>
  </g>
  <path d="M432 282h30M830 282h30" stroke="#E9A948" stroke-width="3"/><path d="m455 274 12 8-12 8M853 274l12 8-12 8" fill="#E9A948"/>
</svg>
