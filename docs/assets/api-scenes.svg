<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TensorsLab Vision API scene map</title>
  <desc id="desc">Image and video skills share a common scene map and return task records for quality review.</desc>
  <rect width="1400" height="430" rx="28" fill="#183A36"/>
  <circle cx="1160" cy="82" r="170" fill="#BF5A3F" fill-opacity=".36"/><circle cx="1260" cy="340" r="210" fill="#E9A948" fill-opacity=".16"/>
  <g font-family="'Avenir Next', 'Helvetica Neue', sans-serif">
    <text x="72" y="72" font-size="16" letter-spacing="3" fill="#E9A948">TENSORSLAB VISION / API SCENES</text>
    <text x="72" y="116" font-size="34" font-weight="700" fill="#FFFDF8">Direct APIs + reusable workflows</text>
    <text x="72" y="150" font-size="16" fill="#C8D4CE">The API skills generate assets. The Workshop turns a brief into approved calls.</text>
    <g transform="translate(72 208)"><rect width="360" height="150" rx="20" fill="#FFFDF8"/><text x="26" y="38" font-size="13" letter-spacing="2" fill="#943F2B">TL-IMAGE</text><text x="26" y="78" font-size="25" font-weight="700" fill="#183A36">Image production</text><text x="26" y="110" font-size="15" fill="#4D625D">Text · references · variants</text><text x="26" y="134" font-size="13" fill="#4D625D">SeeDream / Z-Image / polling</text></g>
    <g transform="translate(470 208)"><rect width="360" height="150" rx="20" fill="#BF5A3F"/><text x="26" y="38" font-size="13" letter-spacing="2" fill="#FCE8D8">TL-VIDEO</text><text x="26" y="78" font-size="25" font-weight="700" fill="#FFFDF8">Video production</text><text x="26" y="110" font-size="15" fill="#FCE8D8">Text · image motion · status</text><text x="26" y="134" font-size="13" fill="#FCE8D8">SeeDance V2 / local download</text></g>
    <g transform="translate(868 208)"><rect width="430" height="150" rx="20" fill="#E9A948"/><text x="26" y="38" font-size="13" letter-spacing="2" fill="#183A36">WORKSHOP</text><text x="26" y="78" font-size="25" font-weight="700" fill="#183A36">Workflow planning</text><text x="26" y="110" font-size="15" fill="#183A36">Listings · detail pages · ad clips</text><text x="26" y="134" font-size="13" fill="#183A36">Plan · approve · review · retry</text></g>
